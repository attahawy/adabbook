<VirtualHost *:80>
    ServerName adabbook.localhost
    DocumentRoot "/Users/samy/Sites/adabbook/dist"
    DirectoryIndex index.html

    <Directory "/Users/samy/Sites">
        AllowOverride None
    </Directory>

    <Directory "/Users/samy/Sites/adabbook/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require local
    </Directory>

    ErrorLog "/opt/homebrew/var/log/httpd/adabbook-error_log"
    CustomLog "/opt/homebrew/var/log/httpd/adabbook-access_log" common
</VirtualHost>
